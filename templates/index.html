<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Trading Bot</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0d1117;
      --surface:    #161b22;
      --surface2:   #21262d;
      --border:     #30363d;
      --text:       #e6edf3;
      --muted:      #8b949e;
      --green:      #3fb950;
      --green-dim:  #1a4721;
      --red:        #f85149;
      --red-dim:    #4a1515;
      --yellow:     #d29922;
      --yellow-dim: #3d2e00;
      --blue:       #58a6ff;
      --cyan:       #79c0ff;
      --radius:     8px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 11px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .logo { font-size: 17px; font-weight: 700; color: var(--cyan); white-space: nowrap; }
    .logo span { color: var(--green); }
    .header-btns { display: flex; gap: 8px; }
    .btn {
      background: var(--blue); border: none; border-radius: 6px;
      color: #0d1117; cursor: pointer; font-size: 12px; font-weight: 700;
      padding: 7px 14px; transition: opacity .15s; white-space: nowrap;
    }
    .btn:hover { opacity: .85; }
    .btn.outline {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn.outline:hover { border-color: var(--text); color: var(--text); }
    .header-right {
      margin-left: auto; display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--muted);
    }
    #refresh-pill {
      display: none;
      background: var(--green-dim); border: 1px solid var(--green);
      border-radius: 12px; color: var(--green); font-size: 11px;
      font-weight: 700; padding: 3px 10px; white-space: nowrap;
    }
    #countdown { color: var(--yellow); font-weight: 700; }
    .hdr-spin {
      display: none; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      padding: 14px 20px 20px;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); } }
    @media (max-width: 680px)  { .grid { grid-template-columns: 1fr; grid-template-rows: none; } }

    /* ── Panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color .25s;
      min-height: 320px;
    }
    .panel.sig-buy  { border-color: var(--green); }
    .panel.sig-sell { border-color: var(--red); }
    .panel.sig-hold { border-color: var(--yellow); }

    /* ── Panel header ── */
    .panel-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .ticker-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      padding: 5px 9px;
      text-transform: uppercase;
      outline: none;
      min-width: 0;
      transition: border-color .2s;
    }
    .ticker-input:focus { border-color: var(--blue); }
    .ticker-input::placeholder { font-weight: 400; text-transform: none; color: var(--muted); font-size: 12px; }
    .btn-scan {
      background: var(--blue); border: none; border-radius: 5px;
      color: #0d1117; cursor: pointer; font-size: 11px; font-weight: 700;
      padding: 5px 11px; flex-shrink: 0; transition: opacity .15s;
    }
    .btn-scan:hover { opacity: .85; }
    .btn-scan:disabled { opacity: .4; cursor: not-allowed; }
    .sig-pill {
      display: none;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sig-pill.BUY  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .sig-pill.SELL { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }
    .sig-pill.HOLD { background: var(--yellow-dim);color: var(--yellow);border: 1px solid var(--yellow); }
    .price-tag {
      display: none;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-x {
      display: none;
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; line-height: 1;
      padding: 2px 4px; flex-shrink: 0;
      transition: color .15s;
    }
    .btn-x:hover { color: var(--red); }

    /* ── Panel body ── */
    .panel-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* Empty state */
    .empty-msg {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 8px;
      font-size: 13px;
      padding: 20px;
    }
    .empty-msg .icon { font-size: 28px; opacity: .4; }

    /* Chart area */
    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 180px;
    }
    .chart-el {
      position: absolute;
      inset: 0;
    }
    .chart-legend {
      position: absolute;
      top: 5px; left: 7px;
      z-index: 10;
      font-size: 10px;
      color: var(--muted);
      pointer-events: none;
      background: rgba(13,17,23,.7);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }
    .chart-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13,17,23,.7);
      z-index: 20;
    }

    /* Stats rows */
    .stats-section {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 7px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stat-label { font-size: 10px; color: var(--muted); }
    .stat-val   { font-size: 12px; font-weight: 700; }
    .stat-val.green  { color: var(--green); }
    .stat-val.red    { color: var(--red); }
    .stat-val.yellow { color: var(--yellow); }
    .stat-val.cyan   { color: var(--cyan); }
    .stat-val.blue   { color: var(--blue); }

    /* Spinner */
    .spin {
      width: 22px; height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────── -->
<header>
  <div class="logo">Stock <span>Trading</span> Bot</div>
  <div class="header-btns">
    <button class="btn" id="scan-all-btn" onclick="scanAll()">⟳ Scan All</button>
    <button class="btn outline" onclick="clearAll()">Clear All</button>
  </div>
  <div class="header-right">
    <div class="hdr-spin" id="hdr-spin"></div>
    <div id="hdr-status">Ready — enter tickers below</div>
    <div id="refresh-pill">AUTO · Next in <span id="countdown">3:00</span></div>
  </div>
</header>

<!-- ── 6-panel grid ───────────────────────────────────── -->
<div class="grid" id="grid"></div>

<script>
// ── Constants & state ───────────────────────────────────────────────────────
const PANEL_COUNT = 6;
const REFRESH_SECS = 180;

const state = Array.from({ length: PANEL_COUNT }, () => ({
  ticker:       '',
  chart:        null,
  candleSeries: null,
  vwapSeries:   null,
  loading:      false,
}));

let autoTimer     = null;
let cntdwnTimer   = null;
let secsLeft      = REFRESH_SECS;
let activeScans   = 0;

// ── Build DOM ───────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();

  for (let i = 0; i < PANEL_COUNT; i++) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = `panel-${i}`;
    panel.innerHTML = `
      <div class="panel-hdr">
        <input class="ticker-input" id="inp-${i}" type="text"
               placeholder="e.g. TSLA, AAPL…" maxlength="10"/>
        <button class="btn-scan" id="bscan-${i}">Scan</button>
        <span class="sig-pill" id="pill-${i}"></span>
        <span class="price-tag" id="ptag-${i}"></span>
        <button class="btn-x" id="bx-${i}" title="Clear">✕</button>
      </div>
      <div class="panel-body" id="body-${i}">
        <div class="empty-msg" id="empty-${i}">
          <div class="icon">📈</div>
          <div>Enter a ticker and click Scan</div>
        </div>
        <div class="chart-wrap" id="cwrap-${i}" style="display:none">
          <div class="chart-legend" id="legend-${i}"></div>
          <div class="chart-el" id="chart-${i}"></div>
          <div class="chart-spinner" id="cspinner-${i}" style="display:none">
            <div class="spin"></div>
          </div>
        </div>
        <div class="stats-section" id="levels-${i}" style="display:none"></div>
        <div class="stats-section" id="inds-${i}"   style="display:none"></div>
      </div>
    `;
    frag.appendChild(panel);

    // Attach events after construction
    panel.querySelector(`#inp-${i}`)
         .addEventListener('keydown', e => { if (e.key === 'Enter') scanPanel(i); });
    panel.querySelector(`#bscan-${i}`)
         .addEventListener('click', () => scanPanel(i));
    panel.querySelector(`#bx-${i}`)
         .addEventListener('click', () => clearPanel(i));
  }

  grid.appendChild(frag);
}

// ── Chart ────────────────────────────────────────────────────────────────────
function initChart(idx) {
  const container = document.getElementById(`chart-${idx}`);
  if (!container) return;

  // Destroy existing chart if any
  if (state[idx].chart) {
    state[idx].chart.remove();
    state[idx].chart = null;
  }

  const chart = LightweightCharts.createChart(container, {
    autoSize: true,
    layout: {
      background: { type: 'solid', color: '#0d1117' },
      textColor:  '#8b949e',
      fontSize:   10,
    },
    grid: {
      vertLines: { color: '#21262d' },
      horzLines: { color: '#21262d' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: {
      borderColor: '#30363d',
      scaleMargins: { top: 0.08, bottom: 0.08 },
    },
    timeScale: {
      borderColor:    '#30363d',
      timeVisible:    true,
      secondsVisible: false,
    },
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor:        '#3fb950',
    downColor:      '#f85149',
    borderUpColor:  '#3fb950',
    borderDownColor:'#f85149',
    wickUpColor:    '#3fb950',
    wickDownColor:  '#f85149',
  });

  const vwapSeries = chart.addLineSeries({
    color:     '#79c0ff',
    lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    title:     'VWAP',
    priceLineVisible: false,
    lastValueVisible: false,
  });

  // Crosshair legend
  const legendEl = document.getElementById(`legend-${idx}`);
  chart.subscribeCrosshairMove(param => {
    if (!param.point || !param.seriesData) {
      legendEl.textContent = '';
      return;
    }
    const c = param.seriesData.get(candleSeries);
    const v = param.seriesData.get(vwapSeries);
    if (c) {
      const vStr = v ? `  VWAP: $${v.value.toFixed(2)}` : '';
      legendEl.textContent =
        `O: $${c.open.toFixed(2)}  H: $${c.high.toFixed(2)}  ` +
        `L: $${c.low.toFixed(2)}  C: $${c.close.toFixed(2)}${vStr}`;
    }
  });

  state[idx].chart        = chart;
  state[idx].candleSeries = candleSeries;
  state[idx].vwapSeries   = vwapSeries;
}

function loadChart(idx, candles, vwapData) {
  if (!state[idx].chart) initChart(idx);
  state[idx].candleSeries.setData(candles);
  state[idx].vwapSeries.setData(vwapData);
  state[idx].chart.timeScale().fitContent();
}

// ── Scan ─────────────────────────────────────────────────────────────────────
function scanPanel(idx) {
  const input  = document.getElementById(`inp-${idx}`);
  const ticker = input.value.trim().toUpperCase();
  if (!ticker) { input.focus(); return; }

  state[idx].ticker  = ticker;
  state[idx].loading = true;
  activeScans++;
  updateHeader();

  // Show chart area with spinner, hide empty msg
  document.getElementById(`empty-${idx}`).style.display = 'none';
  document.getElementById(`cwrap-${idx}`).style.display = '';
  document.getElementById(`cspinner-${idx}`).style.display = '';
  document.getElementById(`bscan-${idx}`).disabled = true;

  fetch(`/api/scan?ticker=${encodeURIComponent(ticker)}`)
    .then(r => r.json())
    .then(data => {
      state[idx].loading = false;
      activeScans = Math.max(0, activeScans - 1);
      document.getElementById(`cspinner-${idx}`).style.display = 'none';
      document.getElementById(`bscan-${idx}`).disabled = false;
      if (data.error) {
        showPanelError(idx, data.error);
      } else {
        renderPanel(idx, data);
        ensureAutoRefresh();
      }
      updateHeader();
    })
    .catch(err => {
      state[idx].loading = false;
      activeScans = Math.max(0, activeScans - 1);
      document.getElementById(`cspinner-${idx}`).style.display = 'none';
      document.getElementById(`bscan-${idx}`).disabled = false;
      showPanelError(idx, 'Network error: ' + err.message);
      updateHeader();
    });
}

function scanAll() {
  let scanned = 0;
  for (let i = 0; i < PANEL_COUNT; i++) {
    const val = document.getElementById(`inp-${i}`).value.trim();
    if (val) { scanPanel(i); scanned++; }
  }
  if (!scanned) {
    document.getElementById('hdr-status').textContent = 'Enter at least one ticker first';
  }
}

function clearPanel(idx) {
  // Destroy chart
  if (state[idx].chart) {
    state[idx].chart.remove();
    state[idx].chart        = null;
    state[idx].candleSeries = null;
    state[idx].vwapSeries   = null;
  }
  state[idx].ticker  = '';
  state[idx].loading = false;

  // Reset DOM
  document.getElementById(`inp-${idx}`).value = '';
  document.getElementById(`pill-${idx}`).style.display   = 'none';
  document.getElementById(`ptag-${idx}`).style.display   = 'none';
  document.getElementById(`bx-${idx}`).style.display     = 'none';
  document.getElementById(`empty-${idx}`).style.display  = '';
  document.getElementById(`cwrap-${idx}`).style.display  = 'none';
  document.getElementById(`levels-${idx}`).style.display = 'none';
  document.getElementById(`inds-${idx}`).style.display   = 'none';
  document.getElementById(`legend-${idx}`).textContent   = '';

  const panel = document.getElementById(`panel-${idx}`);
  panel.className = 'panel';
}

function clearAll() {
  for (let i = 0; i < PANEL_COUNT; i++) clearPanel(i);
  clearInterval(autoTimer);
  clearInterval(cntdwnTimer);
  autoTimer = cntdwnTimer = null;
  document.getElementById('refresh-pill').style.display = 'none';
  document.getElementById('hdr-status').textContent = 'Ready — enter tickers below';
}

// ── Render ───────────────────────────────────────────────────────────────────
function renderPanel(idx, d) {
  const action = d.action;
  const panel  = document.getElementById(`panel-${idx}`);
  panel.className = 'panel sig-' + action.toLowerCase();

  // Header
  const pill = document.getElementById(`pill-${idx}`);
  const icons = { BUY: '▲', SELL: '▼', HOLD: '■' };
  pill.textContent = `${icons[action] || '■'} ${action} ${d.confidence}%`;
  pill.className   = `sig-pill ${action}`;
  pill.style.display = '';

  const ptag = document.getElementById(`ptag-${idx}`);
  ptag.textContent = `$${d.price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 })}`;
  ptag.style.display = '';

  document.getElementById(`bx-${idx}`).style.display = '';

  // Chart
  loadChart(idx, d.chart.candles, d.chart.vwap);

  // Trade levels row
  const levelsEl = document.getElementById(`levels-${idx}`);
  const fmt = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const slColor  = action === 'SELL' ? 'green' : 'red';
  const t1Color  = action === 'SELL' ? 'red'   : 'green';
  levelsEl.innerHTML = `
    ${stat('Entry',     fmt(d.entry),     'cyan')}
    ${stat('Stop Loss', fmt(d.stop_loss), slColor)}
    ${stat('Target 1',  fmt(d.target1),   t1Color)}
    ${stat('Target 2',  fmt(d.target2),   t1Color)}
    ${stat('R/R',       d.rr + ' : 1',   'blue')}
    ${stat('Bull / Bear', d.bull + ' / ' + d.bear, action === 'BUY' ? 'green' : action === 'SELL' ? 'red' : 'yellow')}
  `;
  levelsEl.style.display = '';

  // Indicators row
  const ind    = d.indicators;
  const indsEl = document.getElementById(`inds-${idx}`);
  const rsiCol = ind.rsi < 35 ? 'green' : ind.rsi > 65 ? 'red' : 'yellow';
  const histCol= ind.macd_hist >= 0 ? 'green' : 'red';
  const histStr= (ind.macd_hist >= 0 ? '+' : '') + ind.macd_hist.toFixed(4);
  const volSpike = ind.vol_avg && ind.volume > ind.vol_avg * 1.5;
  const volStr = ind.volume.toLocaleString() + (volSpike ? ' ⚡' : '');
  const volCol = volSpike ? 'yellow' : '';
  indsEl.innerHTML = `
    ${stat('RSI 14',     ind.rsi.toFixed(1),         rsiCol)}
    ${stat('MACD Hist',  histStr,                    histCol)}
    ${stat('Stoch K/D',  ind.stk_k.toFixed(0) + '/' + ind.stk_d.toFixed(0), '')}
    ${stat('VWAP',       '$' + ind.vwap.toFixed(2),  'cyan')}
    ${stat('EMA 9/21',   '$' + ind.ema9.toFixed(1) + '/' + '$' + ind.ema21.toFixed(1), '')}
    ${stat('ATR 14',     '$' + ind.atr.toFixed(3),   'yellow')}
    ${stat('Volume',     volStr,                     volCol)}
    ${stat('Last scan',  d.scan_time.split(' ')[1],  'muted')}
  `;
  indsEl.style.display = '';
}

function stat(label, val, colorClass) {
  return `<div class="stat">
    <div class="stat-label">${label}</div>
    <div class="stat-val ${colorClass}">${val}</div>
  </div>`;
}

function showPanelError(idx, msg) {
  document.getElementById(`cwrap-${idx}`).style.display = 'none';
  const empty = document.getElementById(`empty-${idx}`);
  empty.innerHTML = `<div class="icon" style="color:var(--red)">⚠</div><div style="color:var(--red);text-align:center;font-size:12px">${msg}</div>`;
  empty.style.display = '';
  const panel = document.getElementById(`panel-${idx}`);
  panel.className = 'panel';
}

// ── Auto-refresh ─────────────────────────────────────────────────────────────
function ensureAutoRefresh() {
  if (autoTimer) return;   // already running
  secsLeft   = REFRESH_SECS;
  autoTimer  = setInterval(() => {
    secsLeft = REFRESH_SECS;
    scanAll();
  }, REFRESH_SECS * 1000);
  cntdwnTimer = setInterval(() => {
    secsLeft = Math.max(0, secsLeft - 1);
    const m = Math.floor(secsLeft / 60);
    const s = String(secsLeft % 60).padStart(2, '0');
    document.getElementById('countdown').textContent = `${m}:${s}`;
  }, 1000);
  document.getElementById('refresh-pill').style.display = '';
}

function updateHeader() {
  const spin   = document.getElementById('hdr-spin');
  const status = document.getElementById('hdr-status');
  if (activeScans > 0) {
    spin.style.display   = 'block';
    status.textContent   = `Scanning ${activeScans} ticker${activeScans > 1 ? 's' : ''}…`;
  } else {
    spin.style.display   = 'none';
    status.textContent   = 'Scans complete';
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
buildGrid();
</script>
</body>
</html>
